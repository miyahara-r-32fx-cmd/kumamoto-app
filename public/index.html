<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>くまもと交通安全ポータル</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts (Material 3風のフォント) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 【1】スプラッシュ画面（オープニングアニメーション） -->
  <div id="splash-screen">
    <div class="splash-content">
      <i data-lucide="map-pin" class="splash-pin"></i>
      <div class="kinetic-text">
        <span>く</span><span>ま</span><span>も</span><span>と</span><span>交</span><span>通</span><span>安</span><span>全</span><span>ポ</span><span>ー</span><span>タ</span><span>ル</span>
      </div>
    </div>
  </div>

  <!-- 【2】メインアプリ領域 -->
  <div id="app-container" class="blurred">
    
    <!-- Material 3 App Bar（上部バー） -->
    <header class="md3-app-bar">
      <button id="menu-btn" class="icon-btn"><i data-lucide="menu"></i></button>
      <h1 class="app-title">自転車危険マップ</h1>
      <button id="add-btn" class="icon-btn filled-tonal"><i data-lucide="plus"></i></button>
    </header>

    <!-- メインコンテンツ（地図） -->
    <main class="main-content">
      <!-- プル・トゥ・リフレッシュの表示エリア -->
      <div id="ptr-indicator" class="ptr-indicator">
        <i data-lucide="refresh-cw" class="spin-icon"></i>
        <span>更新中...</span>
      </div>
      
      <div id="map"></div>
    </main>

    <!-- 【3】ピン投稿用ボトムシート -->
    <div id="pin-bottom-sheet" class="bottom-sheet hidden">
      <div class="sheet-handle"></div>
      <h3>危険箇所を投稿</h3>
      <p class="sheet-desc">地図をタップしてピンを置き、詳細を入力してください。</p>
      
      <div class="input-group">
        <label>危険の種類</label>
        <select id="danger-type" class="m3-input">
          <option value="事故多発">事故多発地点</option>
          <option value="見通し不良">見通しが悪い</option>
          <option value="路面悪化">路面が悪い</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="input-group">
        <label>詳細・理由</label>
        <textarea id="danger-reason" class="m3-input" rows="3" placeholder="例: 夜間にライトが見えにくい交差点です"></textarea>
      </div>

      <div class="sheet-actions">
        <button id="cancel-pin" class="m3-btn text-btn">キャンセル</button>
        <button id="submit-pin" class="m3-btn filled-btn">ピンを立てる</button>
      </div>
    </div>

  </div>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
