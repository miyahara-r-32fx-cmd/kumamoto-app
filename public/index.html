<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>くまもと交通安全ポータル</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts (Material 3風のフォント) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 【1】スプラッシュ画面 (オープニングアニメーション) -->
  <div id="splash-screen">
    <div class="splash-content">
      <i data-lucide="map-pin" class="splash-pin"></i>
      <div class="kinetic-text">
        <span>く</span><span>ま</span><span>も</span><span>と</span><span>交</span><span>通</span><span>安</span><span>全</span><span>ポ</span><span>ー</span><span>タ</span><span>ル</span>
      </div>
    </div>
  </div>

  <!-- 【2】メインアプリ領域 (最初はブラーがかかっている) -->
  <div id="app-container" class="blurred">
    
    <!-- Material 3 App Bar (上部バー) -->
    <header class="md3-app-bar">
      <button id="menu-btn" class="icon-btn"><i data-lucide="menu"></i></button>
      <h1 class="app-title">自転車危険マップ</h1>
      <button id="add-btn" class="icon-btn filled-tonal"><i data-lucide="plus"></i></button>
    </header>

    <!-- ハンバーガーメニュー (Navigation Drawer) -->
    <nav id="nav-drawer" class="drawer">
      <div class="drawer-header">
        <h2 class="drawer-title">メニュー</h2>
      </div>
      <ul class="drawer-menu">
        <li><button class="menu-item active" data-target="map-view"><i data-lucide="map"></i> マップ</button></li>
        <li><button class="menu-item" data-target="rules-view"><i data-lucide="book-open"></i> 交通ルール</button></li>
      </ul>
    </nav>
    <div id="drawer-scrim" class="scrim"></div>

    <!-- メインコンテンツ (Pull-to-Refreshエリア) -->
    <main id="ptr-area">
      <div id="ptr-indicator">
        <i data-lucide="refresh-cw" class="spinner"></i>
        <span>マップを更新中...</span>
      </div>
      
      <!-- マップ画面 -->
      <section id="map-view" class="view active-view">
        <div id="map"></div>
      </section>

      <!-- 交通ルール画面 (アコーディオン) -->
      <section id="rules-view" class="view">
        <div class="content-padding">
          <h2 class="section-title">交通ルールを確認しよう</h2>
          <div class="accordion">
            <div class="accordion-item">
              <button class="accordion-header">
                <span>自転車は車道が原則</span>
                <i data-lucide="chevron-down" class="chevron"></i>
              </button>
              <div class="accordion-content">
                <p>道路交通法上、自転車は軽車両と位置付けられています。歩道と車道の区別があるところは車道通行が原則です。</p>
              </div>
            </div>
            <div class="accordion-item">
              <button class="accordion-header">
                <span>車道は左側を通行</span>
                <i data-lucide="chevron-down" class="chevron"></i>
              </button>
              <div class="accordion-content">
                <p>自転車は、道路の左端に寄って通行しなければなりません。右側通行は大変危険です。</p>
              </div>
            </div>
            <div class="accordion-item">
              <button class="accordion-header">
                <span>夜間はライトを点灯</span>
                <i data-lucide="chevron-down" class="chevron"></i>
              </button>
              <div class="accordion-content">
                <p>夜間は必ずライトを点け、反射材を備えた自転車に乗りましょう。</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ボトムシート (詳細表示UI) -->
    <div id="bottom-sheet" class="bottom-sheet">
      <div class="sheet-handle-container">
        <div class="sheet-handle"></div>
      </div>
      <div class="sheet-content">
        <div class="sheet-header">
          <div class="sheet-icon"><i data-lucide="alert-triangle"></i></div>
          <h3 id="sheet-title">危険地点</h3>
        </div>
        <p id="sheet-desc">ピンの詳細情報がここに表示されます。周囲の見通しや事故多発などの具体的な内容です。</p>
        <button id="close-sheet-btn" class="md3-btn primary-btn">閉じる</button>
      </div>
    </div>
    <div id="sheet-scrim" class="scrim"></div>

  </div>

  <!-- スクリプトの読み込み -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
